name: Daily LETF signal

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 2-6"
      timezone: "Asia/Tokyo"

permissions:
  contents: read

concurrency:
  group: daily-letf-signal
  cancel-in-progress: false

jobs:
  generate-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Generate signal
        run: python signal_engine.py --output-dir output

      - name: Add signal to workflow summary
        run: cat output/latest_signal.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signal files
        uses: actions/upload-artifact@v4
        with:
          name: letf-signal-${{ github.run_number }}
          path: output/
          retention-days: 30
          if-no-files-found: error
