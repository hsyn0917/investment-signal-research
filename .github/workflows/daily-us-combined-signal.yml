name: Daily US and combined signal

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 2-5"
      timezone: "Asia/Tokyo"

permissions:
  contents: write

concurrency:
  group: daily-us-combined-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate US and combined signals
        run: |
          python signal_system/signal_engine.py
          python generate_combined_signal.py

      - name: Add run summary
        run: cat combined_signals/latest_portfolio.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save latest signal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add combined_signals/latest_portfolio.json combined_signals/latest_portfolio.md combined_signals/latest_portfolio.html combined_signals/trade_instructions.csv
          if git diff --cached --quiet; then
            echo "No signal change"
          else
            git commit -m "chore: update daily portfolio signal"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload signal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: combined-signal-${{ github.run_id }}
          path: |
            signal_system/output/
            combined_signals/
          retention-days: 30
